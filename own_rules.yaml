# 添加自定义规则示例
interface-name: en0

+rules:
  # 自建探针直连（解决 Chrome WebSocket 离线与握手拦截）
  - "DOMAIN-SUFFIX,owto.de,DIRECT"
  # FortiClient VPN 内网 CRM 兼容直连
  - "DOMAIN-SUFFIX,tccsys.ad,DIRECT"
  - "DOMAIN,EC2PRDDYNWBVM01.tccsys.ad,DIRECT"
  - "DOMAIN,tpd.tccsys.ad,DIRECT"
  - "IP-CIDR,172.30.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,139.217.229.218/32,DIRECT,no-resolve"
  # Google & Antigravity 核心接口（强制绑定 Gemini 策略组，锁定 SG/US 节点，规避 HK 节点 403 地区限制）
  - "DOMAIN-SUFFIX,antigravity-unleash.goog,Gemini"
  - "DOMAIN-SUFFIX,goog,Gemini"
  - "DOMAIN-SUFFIX,antigravity.google,Gemini"
  - "DOMAIN-SUFFIX,antigravity.dev,Gemini"
  - "DOMAIN,daily-cloudcode-pa.googleapis.com,Gemini"
  - "DOMAIN,cloudcode-pa.googleapis.com,Gemini"
  - "DOMAIN,generativelanguage.googleapis.com,Gemini"
  - "DOMAIN-KEYWORD,cloudcode,Gemini"
  - "DOMAIN-KEYWORD,antigravity,Gemini"
  - "DOMAIN,firebaselogging-pa.googleapis.com,Gemini"
  - "DOMAIN-SUFFIX,googleapis.com,谷歌服务"
  - "DOMAIN-SUFFIX,googleusercontent.com,谷歌服务"
  - "DOMAIN-SUFFIX,google.com,谷歌服务"
  - "DOMAIN-SUFFIX,gstatic.com,谷歌服务"
  # 常用国内直连
  - "DOMAIN-SUFFIX,baidu.com,DIRECT"
  - "DOMAIN-SUFFIX,tencent.com,DIRECT"
  - "DOMAIN-SUFFIX,edu.cn,DIRECT"
  - "DOMAIN-SUFFIX,webtrn.cn,DIRECT"
  # Linux.do & Cloudflare 挑战验证同源同节点分流（消除 403 / 保证 Turnstile 秒过）
  - "DOMAIN-SUFFIX,linux.do,全球加速"
  - "DOMAIN-SUFFIX,ldstatic.com,全球加速"
  - "DOMAIN,challenges.cloudflare.com,全球加速"
  - "DOMAIN,turnstile.cloudflare.com,全球加速"
  - "DOMAIN,static.cloudflareinsights.com,全球加速"
  # 媒体与社区（优先全球加速/自动测速选择，规避单节点失效）
  - "DOMAIN-SUFFIX,jmsuper.com,全球加速"
  - "DOMAIN-SUFFIX,jmsooo.com,全球加速"
  - "DOMAIN-SUFFIX,cr18.eu.org,全球加速"
  - "DOMAIN-SUFFIX,themoviedb.org,全球加速"
  - "DOMAIN-SUFFIX,tmdb.org,全球加速"
  - "DOMAIN-SUFFIX,deeplx.org,全球加速"
