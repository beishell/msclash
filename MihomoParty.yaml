# Mixed Port (兼容 Chrome SOCKS5 WebSocket 握手)
mixed-port: 7891
port: 0
socks-port: 0
# 出站接口名（跨平台兼容：由各端系统根据物理网卡自动适配或覆写脚本动态绑定）
# interface-name: en0

# TUN 模式防死锁与防回环配置（关闭动态探测，绑定物理网卡 en0，排除代理节点与 VPN 网段）
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-redirect: false
  auto-detect-interface: false
  dns-hijack:
    - any:53
  route-exclude-address:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 103.72.62.103/32
    - 139.217.229.218/32
    - 172.16.0.0/12
    - 172.30.0.0/16
    - 192.168.0.0/16
    - fd7a:115c:a1e0::/48
  exclude-interface:
    - Tailscale
    - utun4
  mtu: 1500
  device: utun1500
  route-address:
    - 0.0.0.0/1
    - 128.0.0.0/1
    - ::/1
    - 8000::/1
  strict-route: false

# DNS 安全配置 (纯净防泄露架构)
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.tccsys.ad
    - +.ts.net
    - +.tailscale.com
    - +.tailscale.io
    - cu.090227.xyz
    - cf.090227.xyz
    - ct.090227.xyz
    - cm.090227.xyz
    - skk.moe
    - +.090227.xyz
    - +.729927.xyz
  # 引导 DNS (用于本地解析引导)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1
  # 解析代理节点域名使用的 DNS (支持 DoH，规避 OpenWrt 劫持)
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - 223.5.5.5
    - 119.29.29.29
  # 直连域名专用的国内快速加密 DNS
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 国外域名及默认 DNS 服务器 (纯净海外 DoH，彻底杜绝国内 DNS 泄露)
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  # 针对国内域名与内网域名的精确分流策略 (确保国内网站秒开且不泄露)
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.tccsys.ad":
      - 172.30.190.20#utun7
    "tccsys.ad":
      - 172.30.190.20#utun7
    "EC2PRDDYNWBVM01.tccsys.ad":
      - 172.30.190.20#utun7
    "tpd.tccsys.ad":
      - 172.30.190.20#utun7
  # DNS 遵循分流规则路由 (关键：国外 DNS 请求全部走代理节点加密出境)
  respect-rules: true
  # 备用 DNS 服务器
  fallback:
    - tls://8.8.8.8:853
    - tls://1.0.0.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

